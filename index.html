
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>MM FARMA - Controle de Faltas</title>
    <link rel="icon" type="image/png" href="./favicon.png">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .painel {
      background: white;
      max-width: 430px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 16px #0002;
    }

    h1 {
      color: #1565c0;
      margin-bottom: 5px;
    }

    .subtitulo {
      color: #555;
      margin-bottom: 25px;
    }

    input, button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 9px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #entrar { background: #1565c0; }
    #sair { background: #666; }
    #botaoVoz { background: #d32f2f; }
    #botaoSalvar { background: #1565c0; }

    #areaApp { display: none; }

    #usuario, #statusVoz, #mensagem {
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #usuario {
      color: #1565c0;
      font-weight: bold;
    }

    #mensagem {
      color: #1565c0;
      font-weight: bold;
    }

    .rodape {
      margin-top: 25px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>
  <main class="painel">
    <h1>MM FARMA</h1>

    <p class="subtitulo">
      Controle Inteligente de Faltas
    </p>

    <section id="areaLogin">
      <p>Entre com sua conta Google autorizada.</p>

      <button id="entrar" type="button">
        Entrar com Google
      </button>
    </section>

    <section id="areaApp">
      <p id="usuario"></p>

      <button id="sair" type="button">
        Sair da conta
      </button>

      <button id="botaoVoz" type="button">
        🎤 Falar produto
      </button>

      <p id="statusVoz" aria-live="polite"></p>

      <input
        type="text"
        id="produto"
        placeholder="Nome do produto em falta"
        autocomplete="off"
        maxlength="250"
      >

      <button id="botaoSalvar" type="button">
        Registrar falta
      </button>
    </section>

    <p id="mensagem" aria-live="polite"></p>

    <p class="rodape">
      MM FARMA — Controle de Faltas
    </p>
  </main>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCwC_Nc_7nYBuS0rFBlLv7Syj8PhbdMbYM",
      authDomain: "mm-farma-faltas.firebaseapp.com",
      projectId: "mm-farma-faltas",
      storageBucket: "mm-farma-faltas.firebasestorage.app",
      messagingSenderId: "849774671234",
      appId: "1:849774671234:web:b5857706065a20637b8b9b"
    };

    const URL_SERVIDOR =
      "https://script.google.com/macros/s/AKfycbxR-C8MOCmdNrwV1nT4Xm8WhWcIFkXfbLU_5ylNuqrojrc13Wks3j26ZYmkW7FYAr2nuQ/exec";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const autorizados = {
      "nadia.reboucas2@gmail.com": "Nádia",
      "reboucasmarcol@gmail.com": "Marcos",
      "mmfarma25@gmail.com": "Administração MM FARMA"
    };

    const areaLogin =
      document.getElementById("areaLogin");

    const areaApp =
      document.getElementById("areaApp");

    const usuario =
      document.getElementById("usuario");

    const mensagem =
      document.getElementById("mensagem");

    const campoProduto =
      document.getElementById("produto");

    const botaoVoz =
      document.getElementById("botaoVoz");

    const statusVoz =
      document.getElementById("statusVoz");

    const botaoSalvar =
      document.getElementById("botaoSalvar");

    const botaoSair =
      document.getElementById("sair");

    let atendenteAtual = null;
    let reconhecimentoAtivo = null;
    let salvando = false;
    let acessoNegado = false;

    function mostrarMensagem(texto, cor = "#1565c0") {
      mensagem.textContent = texto;
      mensagem.style.color = cor;
    }

    document.getElementById("entrar")
      .addEventListener("click", async () => {

        acessoNegado = false;
        mostrarMensagem("");

        try {
          await signInWithPopup(auth, provider);
        } catch (erro) {
          mostrarMensagem(
            "Não foi possível entrar: " + erro.code,
            "#d32f2f"
          );
        }
      });

    botaoSair.addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (erro) {
        mostrarMensagem(
          "Erro ao sair: " + erro.code,
          "#d32f2f"
        );
      }
    });

    onAuthStateChanged(auth, async (conta) => {

      atendenteAtual = null;
      areaApp.style.display = "none";
      areaLogin.style.display = "block";
      campoProduto.value = "";
      statusVoz.textContent = "";

      if (reconhecimentoAtivo) {
        reconhecimentoAtivo.abort();
      }

      if (!conta) {
        if (!acessoNegado) mostrarMensagem("");
        return;
      }

      const email =
        (conta.email || "").toLowerCase();

      const nome = autorizados[email];

      if (!nome || !conta.emailVerified) {

        acessoNegado = true;

        mostrarMensagem(
          "Acesso não autorizado para esta conta.",
          "#d32f2f"
        );

        await signOut(auth);
        return;
      }

      atendenteAtual = nome;

      usuario.textContent =
        "Atendente: " + nome;

      areaLogin.style.display = "none";
      areaApp.style.display = "block";

      mostrarMensagem("");
    });

    botaoVoz.addEventListener("click", () => {

      if (salvando || !atendenteAtual) return;

      const SpeechAPI =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechAPI) {
        statusVoz.textContent =
          "Reconhecimento de voz indisponível. Digite o produto.";
        return;
      }

      if (reconhecimentoAtivo) return;

      try {

        const reconhecimento = new SpeechAPI();

        reconhecimentoAtivo = reconhecimento;

        reconhecimento.lang = "pt-BR";
        reconhecimento.continuous = false;
        reconhecimento.interimResults = false;

        reconhecimento.onstart = () => {

          botaoVoz.disabled = true;
          botaoSalvar.disabled = true;

          botaoVoz.textContent = "🎤 Ouvindo...";

          statusVoz.textContent =
            "Pode falar o nome do produto.";

          mostrarMensagem("");
        };

        reconhecimento.onresult = (evento) => {

          if (!atendenteAtual) return;

          campoProduto.value =
            evento.results[0][0].transcript.trim();

          statusVoz.textContent =
            "✅ Produto reconhecido! Confira o nome.";
        };

        reconhecimento.onerror = (evento) => {

          statusVoz.textContent =
            "Erro no microfone: " + evento.error;
        };

        reconhecimento.onend = () => {

          reconhecimentoAtivo = null;
          botaoVoz.disabled = salvando;
          botaoSalvar.disabled = salvando;
          botaoVoz.textContent = "🎤 Falar produto";
        };

        reconhecimento.start();

      } catch (erro) {

        reconhecimentoAtivo = null;
        botaoVoz.disabled = false;
        botaoSalvar.disabled = false;
        botaoVoz.textContent = "🎤 Falar produto";

        statusVoz.textContent =
          "Erro ao iniciar: " + erro.message;
      }
    });

    async function salvarFalta() {

      if (salvando || reconhecimentoAtivo) return;

      const produto = campoProduto.value.trim();
      const conta = auth.currentUser;

      if (!conta || !atendenteAtual) {

        mostrarMensagem(
          "Entre com sua conta autorizada.",
          "#d32f2f"
        );

        return;
      }

      if (!produto || produto.length > 250) {

        mostrarMensagem(
          "Informe um nome de produto válido.",
          "#d32f2f"
        );

        campoProduto.focus();
        return;
      }

      salvando = true;

      botaoSalvar.disabled = true;
      botaoVoz.disabled = true;
      botaoSair.disabled = true;
      campoProduto.disabled = true;

      botaoSalvar.textContent = "Registrando...";

      mostrarMensagem(
        "Enviando produto para a planilha..."
      );

      const controlador = new AbortController();

      const limite = setTimeout(
        () => controlador.abort(),
        45000
      );

      try {

        const token = await conta.getIdToken();

        const resposta = await fetch(URL_SERVIDOR, {

          method: "POST",

          headers: {
            "Content-Type": "text/plain;charset=UTF-8"
          },

          body: JSON.stringify({
            token: token,
            produto: produto
          }),

          redirect: "follow",
          credentials: "omit",
          signal: controlador.signal

        });

        if (!resposta.ok) {
          throw new Error("Falha na comunicação.");
        }

        const resultado = await resposta.json();

        if (resultado.ok === true) {

          mostrarMensagem(
            "✅ " + resultado.mensagem,
            "#188038"
          );

          campoProduto.value = "";
          statusVoz.textContent = "";

        } else if (resultado.duplicado === true) {

          mostrarMensagem(
            "⚠️ Este produto já está na lista de faltas!",
            "#b26a00"
          );

        } else {

          mostrarMensagem(
            resultado.mensagem ||
            "Não foi possível registrar o produto.",
            "#d32f2f"
          );
        }

      } catch (erro) {

        mostrarMensagem(
          "Não foi possível confirmar o registro. " +
          "Confira a planilha antes de tentar novamente.",
          "#d32f2f"
        );

        console.error("Falha na comunicação:", erro);

      } finally {

        clearTimeout(limite);

        salvando = false;

        botaoSalvar.disabled = false;
        botaoVoz.disabled = false;
        botaoSair.disabled = false;
        campoProduto.disabled = false;

        botaoSalvar.textContent = "Registrar falta";
      }
    }

    botaoSalvar.addEventListener(
      "click",
      salvarFalta
    );

    campoProduto.addEventListener(
      "keydown",
      (evento) => {

        if (evento.key === "Enter") {
          evento.preventDefault();
          salvarFalta();
        }
      }
    );

  </script>
</body>
</html>
